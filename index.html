<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Astronavis — Galactic Cartography & Navigation</title>

    <meta
            name="description"
            content="Astronavis is an independent open-source project for galactic cartography, stellar navigation and exploration of the Star Wars galaxy."
    />

    <meta name="robots" content="index, follow, max-image-preview:large"/>
    <meta name="theme-color" content="#020b16"/>

    <link rel="canonical" href="https://astronavis.io/"/>

    <!-- Open Graph -->
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="Astronavis"/>

            property="og:title"
            content="Astronavis — Galactic Cartography & Navigation"
    />

            property="og:description"
            content="An independent open-source project for galactic cartography, stellar navigation and exploration of the Star Wars galaxy."
    />

            property="og:image"
            content="https://astronavis.io/assets/wallpapers/wallpaper.png"
    />

            property="og:image:alt"
            content="Astronavis galactic cartography and navigation"
    />

    <!-- X / Twitter Card -->
    <meta name="twitter:card" content="summary_large_image"/>
    <meta
            name="twitter:title"
            content="Astronavis — Galactic Cartography & Navigation"
    />
    <meta
            name="twitter:description"
            content="An independent open-source project for galactic cartography, stellar navigation and exploration of the Star Wars galaxy."
    />
    <meta
            name="twitter:image"
            content="https://astronavis.io/assets/wallpapers/wallpaper.png"
    />
    <meta
            name="twitter:image:alt"
            content="Astronavis galactic cartography and navigation"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@graph": [
                {
                    "@type": "WebSite",
                    "@id": "https://astronavis.io/#website",
                    "url": "https://astronavis.io/",
                    "name": "Astronavis",
                    "description": "Astronavis is an independent open-source project for galactic cartography, stellar navigation and exploration of the Star Wars galaxy.",
                    "inLanguage": "en",
                    "publisher": {
                        "@id": "https://astronavis.io/#organization"
                    }
                },
                {
                    "@type": "Organization",
                    "@id": "https://astronavis.io/#organization",
                    "name": "Astronavis",
                    "url": "https://astronavis.io/",
                    "logo": {
                        "@type": "ImageObject",
                        "url": "https://astronavis.io/assets/logo/stella.png"
                    },
                    "email": "hello@astronavis.io",
                    "sameAs": [
                        "https://github.com/astronavis-dev"
                    ]
                }
            ]
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Elegant geometric font closer to the original concept -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">

            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"

    <script defer src="js/klaro-config.js"></script>
    <script defer src="https://cdn.kiprotect.com/klaro/v0.7.22/klaro.js"></script>

    <link rel="stylesheet" href="css/styles.css">

<body>

<div class="background-overlay"></div>

        </p>

            ASTRONAVIS
        </h1>

        <div class="divider"></div>

        <p class="tagline">
            Navigate with precision
        </p>

        <p class="subtitle">
            A new stellar navigation experience is taking shape beyond the known routes.
        </p>

        <p class="coming-soon">
            We'll guide you... very soon.
        </p>

        <div class="actions">
            <a class="btn btn-primary" href="mailto:hello@astronavis.io">
                CONTACT US
            </a>

            <a class="btn btn-secondary" href="https://github.com/astronavis-dev">
                GITHUB
            </a>
